<!doctype html>
<html>

<head>
    <spf-font id="default-font" src="./Monogram5x8.spf" default></spf-font>
</head>

<body>
    <div class="content">
        <div class="control" style="display: inline-block">
            <p>Rendered Text:</p>
            <input type="text" value="Hello!" id="text" />
            <p>Letter Spacing:</p>
            <input type="number" value="2" id="letter-spacing" />
            <p>Colors:</p>
            <div id="color-tables-div"></div>
        </div>
        <p>Output:</p>
        <div class="output">
            <spf-text letter-spacing="2" style="height: 8rem" class="bannerText">Hello!</spf-text>
        </div>
        <p>Pixel Process (Internal)</p>
        <pre><code>function pixel_process(pixel) {
    return pixel;
}</code></pre>
    </div>
    <script src="./pkg/web/js/dom_elements.js" type="module"></script>
    <script>
        function areArraysEqual(arr1, arr2) {
            if (arr1.length !== arr2.length) {
                return false;
            }
            return arr1.every((value, index) => value === arr2[index]);
        }

        function pixel_process(pixel) {
            return pixel;
        }
        let banners = document.getElementsByClassName("bannerText");
        for (let i = 0; i < banners.length; i++) {
            banners[i].ondraw = pixel_process;
        }

        const input = document.getElementById("text");
        input.addEventListener("input", updateValue);

        function updateValue(e) {
            let texts =
                document.getElementsByClassName("output")[0].children;
            for (var i = 0; i < texts.length; i++) {
                texts[i].textContent = e.target.value;
            }
        }

        const numberBox = document.getElementById("letter-spacing");
        numberBox.addEventListener("input", updateLetterSpacing);

        function updateLetterSpacing(e) {
            let texts = document.getElementsByClassName("bannerText");
            for (var i = 0; i < texts.length; i++) {
                texts[i].setAttribute("letter-spacing", e.target.value);
                texts[i].update_texture();
            }
        }

        const defaultFont = document.getElementById("default-font");
        defaultFont.addEventListener("ready", function () {
            const colorTables = defaultFont.colors();
            for (let i = 0; i < colorTables.length; i++) {
                const table = colorTables[i];
                const tableDiv = document.createElement("div");
                tableDiv.textContent = `Color Table ${i}:`;
                for (let j = 0; j < table.length; j++) {
                    const color = table[j];
                    let colorInput = document.createElement("input");
                    colorInput.type = "color";
                    colorInput.value = color;

                    tableDiv.colorTableIndex = i;
                    colorInput.colorIndex = j;

                    tableDiv.addEventListener("input", function (e) {
                        const hexColor = e.target.value;
                        const tableIndex = this.colorTableIndex;
                        const colorIndex = e.target.colorIndex;
                        defaultFont.set_color(tableIndex, colorIndex, hexColor);

                        let banners = document.getElementsByClassName("bannerText");
                        for (let i = 0; i < banners.length; i++) {
                            banners[i].update_texture();
                        }
                    });

                    tableDiv.appendChild(colorInput);
                }
                document
                    .getElementById("color-tables-div")
                    .appendChild(tableDiv);
            }
        });
    </script>
</body>

</html>
